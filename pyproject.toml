[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jakal-search"
version = "0.1.0"
description = "Recursive evidence search engine with clustering, pruning, and trust filtering."
readme = "README.md"
requires-python = ">=3.12"
keywords = [
  "search",
  "information-retrieval",
  "clustering",
  "ranking",
  "exploratory-search",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
]

[project.urls]
Homepage = "https://github.com/Ahnd6474/jakal-search"
Repository = "https://github.com/Ahnd6474/jakal-search"
Issues = "https://github.com/Ahnd6474/jakal-search/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "twine>=6.1",
]
directml = ["torch-directml>=0.2.5.dev240914; platform_system == 'Windows'"]
advanced-clustering = ["hdbscan>=0.8.33"]

[project.scripts]
jakal-search = "jakal_search.cli:main"
jakal-search-tune = "jakal_search.tuning:main"
jakal-search-trust = "jakal_search.trust_training:main"
jakal-search-expand = "jakal_search.expansion_training:main"
jakal-search-branch = "jakal_search.branch_training:main"
jakal-search-reranker = "jakal_search.reranker_training:main"
jakal-search-falsehood = "jakal_search.falsehood_training:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
exclude = [
  ".idea/**",
  ".pytest_cache/**",
  ".venv/**",
  "build/**",
  "dist/**",
  "outputs/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "/jakal_search",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]
exclude = [
  "/.gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["jakal_search"]
