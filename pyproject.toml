[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jakal-search"
version = "0.1.0"
description = "Tree-based exploratory search engine with clustering, pruning, and trust filtering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
models = ["sentence-transformers>=3.0"]
advanced-clustering = ["hdbscan>=0.8.33"]

[project.scripts]
jakal-search = "jakal_search.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
