[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jakal-search"
version = "0.1.0"
description = "Tree-based exploratory search engine with clustering, pruning, and trust filtering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
models = ["sentence-transformers>=3.0"]
directml = ["torch-directml>=0.2.5.dev240914; platform_system == 'Windows'"]
advanced-clustering = ["hdbscan>=0.8.33"]

[project.scripts]
jakal-search = "jakal_search.cli:main"
jakal-search-tune = "jakal_search.tuning:main"
jakal-search-gui = "jakal_search.gui_api:main"
jakal-search-trust = "jakal_search.trust_training:main"
jakal-search-branch = "jakal_search.branch_training:main"
jakal-search-reranker = "jakal_search.reranker_training:main"
jakal-search-falsehood = "jakal_search.falsehood_training:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
